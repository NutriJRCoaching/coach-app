# Manda los recordatorios de Team JR con la app cerrada (cada 15 min, gratis)
name: Recordatorios Team JR
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  avisos:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ON == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
